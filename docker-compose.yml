services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bpm
      POSTGRES_USER: bpm
      POSTGRES_PASSWORD: bpm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpm -d bpm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    # Docker Hub's minio/minio repo rejects pulls (see minio/minio#20560); quay.io is the
    # vendor-maintained mirror that actually works.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bpm
      MINIO_ROOT_PASSWORD: bpm12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  bpm-api:
    build:
      context: ./src
      dockerfile: BPM.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=bpm;Username=bpm;Password=bpm"
      Jwt__Secret: "${JWT_SECRET:?JWT_SECRET must be set — see DEPLOYMENT.md}"
      Jwt__Issuer: "bpm-platform"
      Jwt__Audience: "bpm-platform"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "bpm"
      Minio__SecretKey: "bpm12345"
      Minio__BucketName: "bpm-attachments"
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  bpm-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: "http://localhost:5080"
    ports:
      - "5173:80"
    depends_on:
      - bpm-api

volumes:
  postgres_data:
  minio_data:
