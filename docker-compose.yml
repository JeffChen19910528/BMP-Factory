services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bpm
      POSTGRES_USER: bpm
      POSTGRES_PASSWORD: bpm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpm -d bpm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    # Docker Hub's minio/minio repo rejects pulls (see minio/minio#20560); quay.io is the
    # vendor-maintained mirror that actually works.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bpm
      MINIO_ROOT_PASSWORD: bpm12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    # Phase 10 — MinIO's own official liveness endpoint (confirmed reachable via curl, which this
    # image bundles). Without this, bpm-api had no compose-level guarantee MinIO was actually
    # ready before it started accepting attachment-upload traffic — the application itself
    # already tolerates MinIO being briefly unavailable (MinioAttachmentStorage.EnsureBucketAsync
    # connects lazily, and Phase 10's AttachmentService hardening now maps any storage failure to
    # a clean error rather than a raw exception), so this closes the startup race, not a
    # correctness gap in the app.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  bpm-api:
    build:
      context: ./src
      dockerfile: BPM.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=bpm;Username=bpm;Password=bpm"
      Jwt__Secret: "${JWT_SECRET:?JWT_SECRET must be set — see DEPLOYMENT.md}"
      Jwt__Issuer: "bpm-platform"
      Jwt__Audience: "bpm-platform"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "bpm"
      Minio__SecretKey: "bpm12345"
      Minio__BucketName: "bpm-attachments"
      # Phase 6.2: this stack has no real mail server, so Provider stays "Fake" here — a real
      # deployment sets Provider=Smtp plus real Host/Username/Password (never committed; see
      # EmailSettings' own doc comment). Enabled=true + short PollIntervalSeconds/RetryBackoffSeconds
      # so this dev/test stack's own live acceptance test doesn't wait through production-scale
      # retry delays.
      Email__Enabled: "true"
      Email__Provider: "Fake"
      Email__PollIntervalSeconds: "2"
      Email__RetryBackoffSeconds: "3"
      Email__MaxAttempts: "3"
      # Phase 6.4: short PollIntervalSeconds so this dev/test stack's own SLA scheduler live
      # acceptance test doesn't wait through a production-scale (1-minute default) poll interval —
      # same reasoning as Email__PollIntervalSeconds above. A real deployment leaves this unset
      # (defaults to Enabled=true, PollIntervalSeconds=60 — see SlaSchedulerSettings).
      SlaScheduler__Enabled: "true"
      SlaScheduler__PollIntervalSeconds: "5"
    ports:
      - "5080:8080"
    volumes:
      # Phase 10 — durable Serilog file logging (see appsettings.json's Serilog:WriteTo). Console
      # logging is preserved unchanged; this just gives the rolling daily log files (14-day
      # retention, 50MB/file cap — see appsettings.json) somewhere that survives a container
      # recreate, the same way postgres_data/minio_data already do for their own data.
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  bpm-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: "http://localhost:5080"
    ports:
      - "5173:80"
    depends_on:
      - bpm-api

volumes:
  postgres_data:
  minio_data:
  api_logs:
